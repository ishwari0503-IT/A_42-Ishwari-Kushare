<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="container">

        <h1>Student Result Management System</h1>

        <!-- Student Details Box -->
        <div class="form-box">

            <h2>Student Details</h2>

            <div class="form-group">
                <label for="rollNo">Roll Number</label>
                <input type="text" id="rollNo" placeholder="Enter roll number">
            </div>

            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" placeholder="Enter student name">
            </div>

            <div class="form-group">
                <label for="className">Class</label>
                <input type="text" id="className" placeholder="Enter class">
            </div>

        </div>


        <!-- Marks Box -->
        <div class="form-box">

            <h2>Marks Details</h2>

            <div class="marks-container">

                <div class="form-group">
                    <label for="subject1">Subject 1</label>
                    <input type="number" id="subject1" min="0" max="100" placeholder="Marks out of 100">
                </div>

                <div class="form-group">
                    <label for="subject2">Subject 2</label>
                    <input type="number" id="subject2" min="0" max="100" placeholder="Marks out of 100">
                </div>

                <div class="form-group">
                    <label for="subject3">Subject 3</label>
                    <input type="number" id="subject3" min="0" max="100" placeholder="Marks out of 100">
                </div>

            </div>

            <button onclick="addStudent()">Add Student</button>

        </div>


        <!-- Student Marks Display -->
        <div class="table-box">

            <h2>Student Marks Display</h2>

            <table id="resultTable">

                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Class</th>
                        <th>Subject 1</th>
                        <th>Subject 2</th>
                        <th>Subject 3</th>
                        <th>Total</th>
                        <th>Percentage</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                    <!-- Student records will be added here -->
                </tbody>

            </table>

        </div>


        <!-- Topper Box -->
        <div class="topper-box">

            <h2>Topper</h2>

            <p id="topper">
                No student record available.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
